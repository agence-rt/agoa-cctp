<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>AGOA CCTP — Connexion</title>
<style>
  html,body{margin:0;height:100%;-webkit-user-select:none;user-select:none}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#fff;color:#1F2328;display:flex;align-items:center;justify-content:center}
  .c{text-align:center;width:380px}
  .logo{width:92px;height:92px}
  .t{margin-top:16px;font-size:19px;font-weight:700;letter-spacing:.2em}
  .t span{color:#B3261E}
  p{font-size:13px;color:#555;line-height:1.5;margin:14px 0 18px}
  button{font:inherit;cursor:pointer;border-radius:6px}
  .g{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border:1px solid #dadce0;background:#fff;font-size:14px;font-weight:600;color:#3c4043}
  .g:hover{background:#f6f7f8}
  .g[disabled]{opacity:.6;cursor:wait}
  .q{margin-top:12px;border:0;background:transparent;color:#888;font-size:12.5px}
  .s{min-height:20px;margin-top:14px;font-size:13px}
  .s.err{color:#B00020}.s.ok{color:#2E7D32}.s.wait{color:#555}
</style></head>
<body>
  <div class="c">
    <img class="logo" src="splash-logo.png" alt="AGOA">
    <div class="t">AGOA <span>CCTP</span></div>
    <p>AGOA CCTP est réservé à son utilisateur autorisé.<br>Identifiez-vous avec votre compte Google pour activer le logiciel sur ce poste.</p>
    <button class="g" id="go"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Se connecter avec Google</button>
    <div class="s" id="s"></div>
    <button class="q" id="q">Quitter</button>
  </div>
<script>
  const go = document.getElementById("go"), s = document.getElementById("s");
  go.onclick = () => { go.disabled = true; s.className = "s wait"; s.textContent = "Terminez l'identification dans votre navigateur…"; window.agoaLogin.start(); };
  document.getElementById("q").onclick = () => window.agoaLogin.quit();
  window.agoaLogin.onStatus((kind, text) => { s.className = "s " + kind; s.textContent = text; if (kind !== "ok") go.disabled = false; });
</script>
</body></html>
