<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Saisie</title>
<style>
body{font:14px Arial,sans-serif;margin:0;padding:22px;color:#222;background:#f4f4f2}
h1{font-size:16px;margin:0 0 10px;color:#b3261e}
p{margin:0 0 14px;line-height:1.45;color:#444;font-size:13px}
label{display:block;font-weight:bold;margin-bottom:6px}
input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:4px;font:13px Consolas,monospace}
.b{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
button{padding:8px 18px;border:1px solid #aaa;border-radius:4px;background:#fff;font-size:13px;cursor:pointer}
button.p{background:#b3261e;color:#fff;border-color:#b3261e}
</style></head><body>
<h1 id="t"></h1><p id="h"></p>
<label id="l" for="v"></label><input id="v" type="password" autocomplete="off" spellcheck="false">
<div class="b"><button id="n">Annuler</button><button class="p" id="o">Enregistrer</button></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById("t").textContent=q.get("title")||"";document.getElementById("h").textContent=q.get("help")||"";document.getElementById("l").textContent=q.get("label")||"";
const v=document.getElementById("v");v.focus();
document.getElementById("o").onclick=()=>window.secret.send(v.value);
document.getElementById("n").onclick=()=>window.secret.send(null);
v.addEventListener("keydown",e=>{if(e.key==="Enter")window.secret.send(v.value);});
</script></body></html>
